<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset=".55" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#b34dff"/>
    </linearGradient>
    <radialGradient id="shine" cx=".28" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- tuile -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#shine)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="56.5" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
  <!-- le hub : un cœur relié à trois dépôts -->
  <circle cx="128" cy="134" r="58" fill="url(#glow)"/>
  <g stroke="#fff" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M128 134 L70 84"/>
    <path d="M128 134 L186 84"/>
    <path d="M128 134 L128 196"/>
  </g>
  <g fill="#6a63ff" stroke="#fff" stroke-width="11">
    <circle cx="66" cy="80" r="19"/>
    <circle cx="190" cy="80" r="19"/>
    <circle cx="128" cy="200" r="19"/>
  </g>
  <circle cx="128" cy="134" r="27" fill="#fff"/>
  <circle cx="128" cy="134" r="10" fill="#7a5cff"/>
  <!-- étincelle « tendance » -->
  <path d="M196 150 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#fff" fill-opacity=".95"/>
</svg>
