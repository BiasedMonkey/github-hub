<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Hub</title>
<style>
  :root {
    --bg: #0b0e14; --bg2: #10141c; --panel: #151a23; --panel2: #1b2130; --line: #262d3b;
    --line2: #313a4c; --text: #e7ecf3; --muted: #8a94a7; --dim: #5d6779;
    --accent: #6d8cff; --accent2: #9b6dff; --ok: #3fb950; --warn: #e3a52f; --bad: #f2555a;
    --radius: 14px; --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
         font: 14px/1.5 "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
         -webkit-font-smoothing: antialiased; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.fill { fill: currentColor; stroke: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a3242; border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- structure ---------- */
  .app { display: grid; grid-template-columns: 250px 1fr; height: 100vh; }
  aside { background: var(--bg2); border-right: 1px solid var(--line); display: flex;
          flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 14px; }
  .logo { width: 38px; height: 38px; filter: drop-shadow(0 6px 14px rgba(122,92,255,.45)); }
  .brand b { font-size: 16px; letter-spacing: .2px; }
  .brand small { display: block; color: var(--muted); font-size: 11.5px; margin-top: -2px; }
  .nav { overflow-y: auto; padding: 4px 12px 12px; flex: 1; }
  .nav h6 { margin: 18px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em;
            text-transform: uppercase; color: var(--dim); }
  .nav button { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center;
                gap: 10px; padding: 8px 10px; border-radius: 9px; color: #c3cad6; cursor: pointer;
                font-size: 13.5px; transition: background .12s, color .12s; }
  .nav button:hover { background: var(--panel); color: var(--text); }
  .nav button.active { background: linear-gradient(90deg, rgba(109,140,255,.18), rgba(109,140,255,.04));
                       color: #fff; box-shadow: inset 2px 0 0 var(--accent); }
  .nav .emoji { width: 18px; text-align: center; font-size: 15px; }
  .nav .count { margin-left: auto; font-size: 11.5px; color: var(--muted); background: var(--panel2);
                border-radius: 20px; padding: 0 8px; min-width: 22px; text-align: center; }
  .nav .count.hot { background: rgba(227,165,47,.18); color: var(--warn); }
  .side-foot { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
  .side-foot .status { font-size: 12px; color: var(--muted); padding: 0 4px; display: flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.warn { background: var(--warn); } .dot.busy { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 16px 28px; border-bottom: 1px solid var(--line);
            background: rgba(11,14,20,.85); backdrop-filter: blur(8px); }
  .topbar h1 { margin: 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .topbar .sub { color: var(--muted); font-size: 12.5px; }
  .search { margin-left: auto; position: relative; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dim); }
  .search input { width: 260px; padding-left: 34px; }
  #content { flex: 1; overflow-y: auto; padding: 24px 28px 120px; }

  /* ---------- contrôles ---------- */
  input, select { background: var(--panel); color: var(--text); border: 1px solid var(--line2);
                  border-radius: 10px; padding: 8px 12px; font: inherit; outline: none; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,140,255,.18); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px;
         padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2);
         color: var(--text); font: 600 13px/1 inherit; font-family: inherit; cursor: pointer;
         text-decoration: none; white-space: nowrap; transition: transform .08s, background .12s, border-color .12s; }
  .btn:hover:not(:disabled) { border-color: #4a5569; background: #232a3a; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: linear-gradient(135deg, #5b7cff, #7a5cff); border-color: transparent; color: #fff;
                 box-shadow: 0 4px 14px rgba(109,110,255,.3); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.1); background: linear-gradient(135deg, #5b7cff, #7a5cff); }
  .btn.green { background: linear-gradient(135deg, #2ea043, #3fb950); border-color: transparent; color: #fff; }
  .btn.green:hover:not(:disabled) { filter: brightness(1.1); background: linear-gradient(135deg, #2ea043, #3fb950); }
  .btn.warn { background: rgba(227,165,47,.14); border-color: rgba(227,165,47,.45); color: var(--warn); }
  .btn.danger { color: var(--bad); }
  .btn.ghost { background: transparent; }
  .btn.icon { width: 34px; padding: 0; }
  .btn.small { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
  .btn.block { width: 100%; }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3);
          border-top-color: #fff; animation: rot .7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- héro & sections ---------- */
  .hero { position: relative; overflow: hidden; border-radius: 18px; padding: 26px 28px; margin-bottom: 28px;
          background: radial-gradient(120% 140% at 0% 0%, rgba(109,140,255,.28), transparent 55%),
                      radial-gradient(90% 120% at 100% 100%, rgba(155,109,255,.22), transparent 60%), var(--panel);
          border: 1px solid var(--line); }
  .hero h2 { margin: 0 0 4px; font-size: 24px; }
  .hero p { margin: 0; color: #b8c1d1; max-width: 720px; }
  .hero.cat { background: radial-gradient(120% 160% at 0% 0%, color-mix(in srgb, var(--cat) 30%, transparent), transparent 60%), var(--panel); }
  /* ---------- gros buzz ---------- */
  .hero.buzz { background: radial-gradient(110% 160% at 0% 0%, rgba(255,122,61,.38), transparent 58%),
                           radial-gradient(90% 140% at 100% 100%, rgba(255,61,110,.28), transparent 60%), var(--panel);
               border-color: rgba(255,122,61,.35); }
  .buzz-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 12px; border-radius: 10px;
                font-size: 12px; color: #ffd2bd; border: 1px solid rgba(255,122,61,.32);
                background: linear-gradient(90deg, rgba(255,122,61,.16), rgba(255,61,110,.05)); }
  .buzz-strip .rank { font-weight: 800; font-size: 14px; color: #ff8a4c; }
  .buzz-strip .speed { font-weight: 700; color: #fff; }
  .buzz-strip .why { margin-left: auto; font-weight: 600; color: #ff9d6c; }
  .podium { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); margin-bottom: 26px; }
  .podium .card { border-color: rgba(255,122,61,.4); box-shadow: 0 0 0 1px rgba(255,122,61,.12), 0 14px 40px rgba(255,90,60,.12); }
  .podium .buzz-strip .rank { font-size: 22px; line-height: 1; }
  .podium .buzz-strip .speed { font-size: 15px; }
  .hero .big { font-size: 40px; position: absolute; right: 28px; top: 50%; transform: translateY(-50%); opacity: .9; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
  .stat { background: rgba(11,14,20,.5); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .section { margin-bottom: 30px; }
  .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .section-head h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .section-head .n { color: var(--muted); font-size: 12.5px; font-weight: 400; }
  .section-head .more { margin-left: auto; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  /* ---------- recherche GitHub ---------- */
  .search-hero h2 { margin-bottom: 14px; }
  .bigsearch { display: flex; gap: 10px; }
  .bigsearch #ghq { flex: 1; height: 46px; font-size: 15.5px; padding: 0 16px; border-radius: 12px; }
  .bigsearch #glang { width: 160px; height: 46px; border-radius: 12px; }
  .bigsearch .btn { height: 46px; padding: 0 20px; border-radius: 12px; }
  .tips, .recent { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  .recent { margin-top: 10px; }
  .chip-tip { all: unset; cursor: pointer; padding: 3px 10px; border-radius: 20px; background: rgba(11,14,20,.5);
              border: 1px solid var(--line2); color: #c3cad6; font-size: 12px; }
  .chip-tip:hover { border-color: var(--accent); color: #fff; }
  .chip-tip code { color: var(--muted); font-size: 11px; margin-left: 3px; }
  /* ---------- abonnements ---------- */
  .profiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); margin-bottom: 28px; }
  .profile { --cat: var(--accent); display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px;
             background: var(--panel); border: 1px solid var(--line); cursor: pointer; position: relative; }
  .profile:hover { border-color: #4a5569; }
  .profile.on { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,140,255,.15); }
  .profile .pinfo { flex: 1; min-width: 0; display: grid; }
  .profile .pinfo b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile .pinfo span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile .perr { color: var(--bad) !important; }
  .profile .count { font-size: 11px; border-radius: 20px; padding: 1px 8px; }
  .profile .count.hot { background: rgba(227,165,47,.18); color: var(--warn); }
  .profile .pact { display: flex; gap: 4px; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line2); border-radius: 11px; padding: 3px; }
  .seg button { all: unset; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--panel2); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset; }
  .empty { color: var(--muted); padding: 40px; text-align: center; border: 1px dashed var(--line2); border-radius: var(--radius); }

  /* ---------- cartes ---------- */
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { --cat: var(--accent); position: relative; display: flex; flex-direction: column; gap: 12px;
          padding: 18px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line);
          cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
                  background: linear-gradient(90deg, var(--cat), transparent); opacity: .85; }
  .card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--cat) 45%, var(--line)); box-shadow: var(--shadow); }
  .card-top { display: flex; gap: 12px; align-items: flex-start; }
  .avatar { position: relative; width: 44px; height: 44px; border-radius: 11px; flex: none; overflow: hidden;
            display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff;
            background: linear-gradient(135deg, color-mix(in srgb, var(--cat) 70%, #000), color-mix(in srgb, var(--cat) 35%, #000));
            border: 1px solid var(--line2); }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .titles { min-width: 0; flex: 1; }
  .titles .t { font-weight: 700; font-size: 15px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .titles .r { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 9px;
          border-radius: 20px; white-space: nowrap; color: var(--cat);
          background: color-mix(in srgb, var(--cat) 14%, transparent); border: 1px solid color-mix(in srgb, var(--cat) 35%, transparent); }
  .desc { margin: 0; color: #c2cad8; font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 3;
          -webkit-box-orient: vertical; overflow: hidden; min-height: 3em; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11.5px; padding: 2px 9px; border-radius: 20px; background: var(--panel2); color: #aeb8c9; border: 1px solid var(--line2); }
  .meta { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; align-items: center; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .meta svg.i { width: 13px; height: 13px; }
  .lang-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .gain { color: var(--ok); font-weight: 600; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 20px; display: inline-flex; gap: 5px; align-items: center; }
  .b-ok { color: var(--ok); background: rgba(63,185,80,.12); }
  .b-warn { color: var(--warn); background: rgba(227,165,47,.12); }
  .b-bad { color: var(--bad); background: rgba(242,85,90,.12); }
  .b-run { color: #7ea2ff; background: rgba(109,140,255,.14); }
  .b-off { color: var(--muted); background: var(--panel2); }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: auto; padding-top: 4px; }
  .actions .grow { flex: 1; }
  .menu { position: absolute; z-index: 20; min-width: 200px; background: #1d2433; border: 1px solid var(--line2);
          border-radius: 12px; padding: 6px; box-shadow: var(--shadow); }
  .menu button, .menu a { all: unset; box-sizing: border-box; width: 100%; display: flex; gap: 10px; align-items: center;
                          padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--text); }
  .menu button:hover, .menu a:hover { background: var(--panel2); }
  .menu .danger { color: var(--bad); }
  .menu.modes { min-width: 280px; }
  .menu-title { padding: 6px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); }
  .menu-foot { padding: 6px 10px 4px; font-size: 11.5px; color: var(--dim); border-top: 1px solid var(--line2); margin-top: 4px; }
  .menu .mi { flex: 1; font-weight: 600; }
  .menu .mi small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .menu .tick { color: var(--ok); }
  /* favoris : cœur rose rempli quand le projet est dans les favoris */
  .btn.fav.on { color: #ff6b9a; border-color: rgba(255,107,154,.45); background: rgba(255,107,154,.1); }
  .btn.fav.on svg.i, .menu .fav-on svg.i { fill: currentColor; }
  .btn.fav.pop svg.i { animation: pop .35s ease-out; }
  @keyframes pop { 40% { transform: scale(1.35); } }
  .menu .fav-on { color: #ff6b9a; }
  /* bouton « Lancer » + flèche de choix du mode, collés */
  .split { display: inline-flex; }
  .split .btn:first-child:not(:last-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .split .caret { width: 30px; padding: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; box-shadow: inset 1px 0 0 rgba(0,0,0,.25); }
  .split .caret svg.i { width: 14px; height: 14px; }
  /* formulaire « Dans le hub » */
  .dialog-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(5,7,12,.6); backdrop-filter: blur(3px);
                 display: grid; place-items: center; animation: fade .15s; }
  @keyframes fade { from { opacity: 0; } }
  .dialog { width: min(620px, 92vw); background: var(--bg2); border: 1px solid var(--line2); border-radius: 18px;
            padding: 22px 24px; box-shadow: var(--shadow); }
  .dialog-head { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
  .dialog-head h3 { margin: 0; font-size: 18px; }
  .dialog-head span { color: var(--muted); font-size: 12.5px; }
  .dialog label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .dialog textarea { width: 100%; resize: vertical; background: #07090e; color: var(--text); border: 1px solid var(--line2);
                     border-radius: 10px; padding: 10px 12px; font: 13px/1.5 "JetBrains Mono", ui-monospace, monospace; outline: none; }
  .dialog textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,140,255,.18); }
  .dialog code { font-size: 12px; }
  .dialog-tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .dialog-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .menu hr { border: 0; border-top: 1px solid var(--line2); margin: 5px 0; }

  /* ---------- panneau de détails ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(5,7,12,.6); backdrop-filter: blur(3px); z-index: 30;
             opacity: 0; pointer-events: none; transition: opacity .2s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(860px, 92vw); z-index: 31; background: var(--bg2);
            border-left: 1px solid var(--line); display: flex; flex-direction: column; transform: translateX(100%);
            transition: transform .25s cubic-bezier(.2,.8,.2,1); box-shadow: -20px 0 60px rgba(0,0,0,.45); }
  .drawer.open { transform: none; }
  .drawer-head { --cat: var(--accent); padding: 24px 28px 18px; border-bottom: 1px solid var(--line);
                 background: radial-gradient(120% 180% at 0% 0%, color-mix(in srgb, var(--cat) 22%, transparent), transparent 60%); }
  .drawer-head .row { display: flex; gap: 16px; align-items: center; }
  .drawer-head .avatar { width: 64px; height: 64px; border-radius: 16px; }
  .drawer-head h2 { margin: 0; font-size: 22px; }
  .drawer-head .close { margin-left: auto; align-self: flex-start; }
  .drawer-body { overflow-y: auto; padding: 22px 28px 40px; flex: 1; }
  .drawer .actions { flex-wrap: wrap; margin-top: 16px; }
  .lead { font-size: 14.5px; color: #cdd5e2; margin: 0 0 14px; }
  .hint { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin: 0 0 12px; }
  .hint.info { background: rgba(109,140,255,.1); color: #b9c8ff; border: 1px solid rgba(109,140,255,.25); }
  .hint.warn { background: rgba(227,165,47,.08); color: var(--warn); border: 1px solid rgba(227,165,47,.3); }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0 20px; }
  .fact { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 0; }
  .fact span { display: block; color: var(--muted); font-size: 11.5px; }
  .fact b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .readme-frame { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: #0f131b; min-height: 420px; }
  h4.sec { margin: 22px 0 10px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }

  /* ---------- panneau Activité (à droite, à côté du contenu) ---------- */
  .app.with-activity { grid-template-columns: 250px 1fr 380px; }
  .activity { display: none; flex-direction: column; min-height: 0; background: var(--bg2); border-left: 1px solid var(--line); }
  .app.with-activity .activity { display: flex; animation: slidein .2s ease-out; }
  @keyframes slidein { from { transform: translateX(30px); opacity: 0; } }
  .act-head { display: flex; align-items: center; gap: 8px; padding: 18px 16px 14px 20px; border-bottom: 1px solid var(--line); }
  .act-head b { font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .act-head small { display: block; color: var(--muted); font-size: 12px; }
  .act-head .grow { flex: 1; }
  .act-list { overflow-y: auto; padding: 14px; display: grid; gap: 10px; align-content: start; flex: 1; }
  .act-empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 13px; }
  .act-empty svg.i { width: 34px; height: 34px; color: var(--dim); margin-bottom: 10px; }
  .job { --c: var(--accent); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .job.ok { --c: var(--ok); } .job.error { --c: var(--bad); border-color: rgba(242,85,90,.35); }
  .job-top { display: flex; gap: 10px; align-items: center; padding: 12px 12px 10px; cursor: pointer; }
  .job-top .avatar { width: 34px; height: 34px; border-radius: 9px; font-size: 14px; --cat: var(--c); }
  .job-title { flex: 1; min-width: 0; }
  .job-title b { font-size: 13.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-title span { color: var(--muted); font-size: 12px; }
  .job-state { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none;
               color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
  .job-state svg.i { width: 14px; height: 14px; }
  .job-state .spin { border-color: color-mix(in srgb, var(--c) 30%, transparent); border-top-color: var(--c); }
  .progress { height: 4px; margin: 0 12px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, #5b7cff, #9b6dff); border-radius: 4px; transition: width .3s; }
  .progress.indet i { width: 35%; animation: indet 1.2s ease-in-out infinite; }
  @keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  .job-last { padding: 8px 12px 12px; color: var(--muted); font: 11.5px/1.4 "JetBrains Mono", ui-monospace, monospace;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job-log { margin: 0 12px 10px; max-height: 340px; overflow: auto; padding: 10px 12px; border-radius: 9px; background: #07090e;
             border: 1px solid var(--line); color: #b9c3d3; font: 11.5px/1.5 "JetBrains Mono", ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
  .job-tools { display: flex; gap: 6px; padding: 0 12px 12px; }
  .act-btn { position: relative; }
  .act-btn .num { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
                  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .act-btn.on { border-color: var(--accent); background: rgba(109,140,255,.12); }
  .side-foot .status { cursor: pointer; border-radius: 8px; padding: 6px; }
  .side-foot .status:hover { background: var(--panel); color: var(--text); }
  .toasts { position: fixed; right: 20px; bottom: 20px; z-index: 40; display: grid; gap: 10px; transition: right .2s; }
  .app.with-activity ~ .toasts { right: 400px; }
  .toast { display: flex; gap: 10px; align-items: center; min-width: 280px; max-width: 420px; padding: 12px 14px;
           border-radius: 12px; background: #1d2433; border: 1px solid var(--line2); box-shadow: var(--shadow);
           animation: tin .25s ease-out; font-size: 13px; }
  .toast.ok { border-left: 3px solid var(--ok); } .toast.err { border-left: 3px solid var(--bad); }
  @keyframes tin { from { transform: translateY(10px); opacity: 0; } }
  .skeleton { height: 230px; border-radius: var(--radius); background: linear-gradient(90deg, var(--panel) 0%, var(--panel2) 50%, var(--panel) 100%);
              background-size: 200% 100%; animation: shimmer 1.2s infinite; border: 1px solid var(--line); }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>

    <div class="side-foot">

        <div class="sub" id="pageSub"></div>

</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">

  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>

  check: '<path d="M20 6 9 17l-5-5"/>',
  activity: '<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>',
  panel: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  user: '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  sparkle: '<path d="M12 3l1.9 5.8L20 10.7l-6.1 1.9L12 18.4l-1.9-5.8L4 10.7l6.1-1.9z"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  scale: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  github: null,
};
const GH_PATH = "M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z";
const icon = (n, cls = "") => n === "github"
  ? `<svg class="i fill ${cls}" viewBox="0 0 16 16"><path d="${GH_PATH}"/></svg>`
  : `<svg class="i ${cls}" viewBox="0 0 24 24">${ICONS[n]}</svg>`;

const LANG_COLORS = { Rust: "#dea584", Python: "#3572A5", TypeScript: "#3178c6", JavaScript: "#f1e05a",
  "C++": "#f34b7d", C: "#8a8a8a", Go: "#00ADD8", Java: "#b07219", CSS: "#663399", HTML: "#e34c26",
  Shell: "#89e051", Kotlin: "#A97BFF", Swift: "#F05138", "C#": "#178600", Lua: "#5c6bc0", Zig: "#ec915c",
  Dart: "#00B4AB", Vue: "#41b883", Svelte: "#ff3e00", Ruby: "#701516", PHP: "#4F5D95", "Jupyter Notebook": "#DA5B0B" };

/* ================= état ================= */
const S = {
  view: "home", source: "daily", language: "", query: "",
  catalog: null, categories: [], trending: {}, jobs: [],
  activityOpen: false, expanded: new Set(), hidden: new Set(),  // panneau Activité
  favs: new Set(), popFav: null,                                // favoris (enregistrés par le serveur)
  buzz: undefined,                                              // undefined = pas chargé, null = en cours
  search: { q: "", sort: "best", language: "", page: 1, items: [], total: 0, more: false, loading: false, error: null },
  mine: undefined, mineFilter: "all",                           // tes propres dépôts (via gh)
  instSort: "size",                                             // tri de la vue Installés
  follows: undefined, followSet: new Set(), followFilter: "all", followsSeenSent: false,  // abonnements
  newRepos: new Set(),                                          // « nouveaux » vus pendant cette session
  detail: null, checkInfo: null, menu: null,
};
const SOURCES = [["daily", "Aujourd'hui"], ["weekly", "Cette semaine"], ["monthly", "Ce mois"], ["new30", "Nouveaux projets"]];
let pollTimer = null;

/* ================= utilitaires ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const k = n => n == null ? "—" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "k" : String(n);
const bytes = n => n == null ? "—" : n >= 1e9 ? (n / 1e9).toFixed(1).replace(".", ",") + " Go"
  : n >= 1e6 ? Math.round(n / 1e6) + " Mo" : n >= 1e3 ? Math.round(n / 1e3) + " ko" : n + " o";

/* Boutons « bureau » et « menu + favoris », en entrées de menu ⋯ ou en boutons. */
function shortcutButtons(r, style) {
  const l = r.local, sc = l.shortcuts || {}, q = esc(r.repo), cls = style === "btn" ? "btn" : "";
  if (!l.launchable) return style === "btn" ? "" :
    `<div class="menu-foot" style="border:0;margin:0">Compile le projet pour créer des raccourcis.</div>`;
  return `<button class="${cls}" data-act="shortcut" data-kind="desktop" data-on="${!sc.desktop}" data-repo="${q}">
      ${icon("monitor")}${sc.desktop ? "Retirer du bureau" : "Raccourci sur le bureau"}</button>
    <button class="${cls}" data-act="shortcut" data-kind="menu" data-on="${!sc.menu}" data-repo="${q}">
      ${icon("star")}${sc.menu ? "Retirer du menu et des favoris" : "Ajouter au menu et aux favoris"}</button>`;
}
const api = (path, body) => fetch(path, body === undefined ? {} : {
  method: "POST", headers: {"Content-Type": "application/json", "X-Hub": "1"}, body: JSON.stringify(body)
}).then(r => r.json());
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 3600) return `il y a ${Math.max(1, Math.round(s / 60))} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  if (s < 86400 * 30) return `il y a ${Math.round(s / 86400)} j`;
  if (s < 86400 * 365) return `il y a ${Math.round(s / 86400 / 30)} mois`;
  return `il y a ${Math.round(s / 86400 / 365)} an(s)`;
}
const cat = id => S.categories.find(c => c.id === id) || {id: "autres", name: "Autres", icon: "📦", color: "#8b949e"};
const busy = repo => S.jobs.some(j => j.repo === repo && j.state === "running");
const prettyName = n => n.replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
// initiale en fond, photo GitHub par-dessus ; si la photo ne charge pas, l'initiale reste
const avatar = (owner, size) => `<div class="avatar"><span>${esc(owner[0].toUpperCase())}</span>
  <img loading="lazy" src="https://github.com/${esc(owner)}.png?size=${size}" alt="" onerror="this.remove()"></div>`;

/* Un dépôt du catalogue ou des tendances, ramené à une seule forme. */
function norm(r) {
  const [owner, name] = r.repo.split("/");
  return { ...r, owner, name, title: r.title || prettyName(name),
           text: r.summary || r.description || "Pas de description.",
           tagList: (r.tags?.length ? r.tags : (r.topics || [])).slice(0, 6), local: r.local || {} };
}
const allKnown = () => {
  const m = new Map();
  Object.values(S.trending).forEach(d => d?.items?.forEach(i => m.set(i.repo, i)));
  S.buzz?.items?.forEach(i => m.set(i.repo, i));
  S.search.items.forEach(i => m.set(i.repo, i));
  S.mine?.items?.forEach(i => m.set(i.repo, {...m.get(i.repo), ...i}));
  S.follows?.profiles?.forEach(p => p.items.forEach(i => m.set(i.repo, {...m.get(i.repo), ...i})));
  S.catalog?.repos.forEach(r => m.set(r.repo, r));
  return m;
};
const curated = () => (S.catalog?.repos || []).filter(r => r.curated);
const installed = () => (S.catalog?.repos || []).filter(r => r.local?.installed);
// dans l'ordre d'ajout ; un projet tout juste ajouté depuis les tendances est déjà connu ici
const favList = () => { const known = allKnown(); return [...S.favs].map(r => known.get(r)).filter(Boolean); };
const favButton = repo => {
  const on = S.favs.has(repo);
  return `<button class="btn icon fav ${on ? "on" : ""} ${S.popFav === repo ? "pop" : ""}" data-fav="${esc(repo)}"
    title="${on ? "Retirer des favoris" : "Ajouter aux favoris"}">${icon("heart")}</button>`;
};
const MEDALS = ["🥇", "🥈", "🥉"];
const heat = n => "🔥".repeat(n >= 2000 ? 5 : n >= 1000 ? 4 : n >= 500 ? 3 : n >= 250 ? 2 : 1);
function buzzStrip(b) {
  return `<div class="buzz-strip" title="Vitesse : étoiles gagnées par jour (moyenne depuis la création, ou gain récent si plus fort)">
    <span class="rank">${b.rank <= 3 ? MEDALS[b.rank - 1] : "#" + b.rank}</span>
    <span class="speed">≈ ${k(b.per_day)} ★ / jour</span>
    ${b.age_days ? `<span>créé il y a ${b.age_days} j</span>` : ""}
    ${b.week ? `<span>+${k(b.week)} ★ cette semaine</span>` : ""}
    <span class="why">${heat(b.per_day)} ${esc(b.reason)}</span>
  </div>`;
}

/* ---------- abonnements à des profils ---------- */
const follows = login => [...S.followSet].some(f => f.toLowerCase() === login.toLowerCase());
function followButton(owner, style) {
  const on = follows(owner), label = on ? `Ne plus suivre @${owner}` : `Suivre l'auteur (@${owner})`;
  return `<button class="${style === "btn" ? "btn" : ""}" data-follow-toggle="${esc(owner)}" data-on="${!on}">
    ${icon("users")}${esc(label)}</button>`;
}
async function loadFollows(force = false) {
  if (S.follows === null || (S.follows && !force)) return;  // en cours, ou déjà là
  S.follows = null;
  draw();
  S.follows = await api("/api/follows").catch(e => ({error: String(e)}));
  if (S.follows.categories) S.categories = S.follows.categories;
  // une fois la visite notée par le serveur, il ne renvoie plus « nouveau » : on garde
  // en mémoire ce qui l'était pour que les badges restent jusqu'à la fermeture du hub
  S.follows.profiles?.forEach(p => p.items.forEach(i => {
    if (i.new) S.newRepos.add(i.repo);
    i.new = S.newRepos.has(i.repo);
  }));
  draw();
}
async function followAdd(text) {
  if (!text.trim()) return $("#followIn")?.focus();
  const res = await api("/api/follow", {login: text, on: true});
  if (res.error) return toast(res.error, "err");
  S.followSet = new Set(res.follows);
  if ($("#followIn")) $("#followIn").value = "";
  toast(`Tu suis maintenant @${res.login} ✔`, "ok");
  loadFollows(true);
}
async function followSet(login, on) {
  const res = await api("/api/follow", {login, on});
  if (res.error) return toast(res.error, "err");
  S.followSet = new Set(res.follows);
  toast(on ? `Tu suis maintenant @${res.login} ✔` : `Tu ne suis plus @${login}`, "ok");
  if (S.followFilter.toLowerCase() === login.toLowerCase()) S.followFilter = "all";
  loadFollows(true);
}

async function toggleFav(repo) {
  const on = !S.favs.has(repo), name = repo.split("/")[1];
  on ? S.favs.add(repo) : S.favs.delete(repo);  // affiché tout de suite, enregistré ensuite
  S.popFav = on ? repo : null;
  draw();
  const res = await api("/api/favorite", {repo, on, category: allKnown().get(repo)?.category})
    .catch(e => ({error: String(e)}));
  S.popFav = null;
  if (res.error) {
    on ? S.favs.delete(repo) : S.favs.add(repo);
    draw();
    return toast("Favori non enregistré : " + res.error, "err");
  }
  toast(on ? `${name} ajouté aux favoris ❤` : `${name} retiré des favoris`, "ok");
  loadCatalog();
}
const trendItems = () => S.trending[S.source]?.items || [];
function matches(r) {
  if (!S.query) return true;
  const q = S.query.toLowerCase();
  return [r.repo, r.title, r.summary, r.description, ...(r.tags || []), ...(r.topics || []), r.language]
    .some(v => (v || "").toLowerCase().includes(q));
}

/* ================= cartes ================= */
function badges(l) {
  const b = [];
  if (!l.installed) {
    if (l.platform === "windows") b.push(`<span class="badge b-off">Windows uniquement</span>`);
    return b.join("");
  }
  if (l.running) b.push(`<span class="badge b-run">● En cours d'exécution</span>`);
  if (l.behind > 0) b.push(`<span class="badge b-warn">${icon("download")} Mise à jour dispo</span>`);
  else if (l.behind === 0) b.push(`<span class="badge b-ok">${icon("check")} Installé · à jour</span>`);
  else b.push(`<span class="badge b-ok">${icon("check")} Installé</span>`);
  if (l.can_build && !l.built) b.push(`<span class="badge b-warn">Pas encore compilé</span>`);
  if (l.missing?.length) b.push(`<span class="badge b-bad">${icon("alert")} Manque : ${esc(l.missing.join(", "))}</span>`);
  if (l.dirty) b.push(`<span class="badge b-warn">Modifs locales</span>`);
  if (l.size) b.push(`<span class="badge b-off" title="dont ${bytes(l.size.build)} de compilation">💾 ${bytes(l.size.total)}</span>`);
  if (l.shortcuts?.desktop) b.push(`<span class="badge b-off" title="Raccourci sur le bureau">${icon("monitor")}Bureau</span>`);
  if (l.shortcuts?.menu) b.push(`<span class="badge b-off" title="Dans le menu et les favoris KDE">${icon("star")}Menu</span>`);
  if (l.platform === "windows") b.push(`<span class="badge b-off">Windows uniquement</span>`);
  return b.join("");
}

/* Modes de lancement (le serveur dit lesquels existent pour chaque projet). */
const MODES = {
  window: { icon: "monitor", label: "Fenêtre", desc: "L'interface graphique de l'appli" },
  terminal: { icon: "terminal", label: "Terminal", desc: "Dans Konsole, avec tous les messages" },
  hub: { icon: "panel", label: "Dans le hub", desc: "Un formulaire pour l'outil, résultat dans Activité" },
  web: { icon: "globe", label: "Version web", desc: "Dans ton navigateur, sans rien installer" },
};
const modesOf = l => l.modes?.length ? l.modes : (l.web ? ["web"] : []);
function preferredMode(repo, l) {
  let saved = null;
  try { saved = localStorage.getItem("hub.mode." + repo); } catch (e) {}
  const modes = modesOf(l).filter(m => l.installed || m === "web");
  return modes.includes(saved) ? saved : modes[0];
}

function primaryButton(r) {
  const l = r.local, repo = esc(r.repo);
  if (busy(r.repo)) return `<button class="btn primary" disabled><span class="spin"></span>En cours…</button>`;
  if (!l.installed) return `<button class="btn primary" data-act="install" data-repo="${repo}">${icon("download")}${l.platform === "windows" ? "Télécharger" : "Installer"}</button>` +
    (l.web ? `<button class="btn icon" title="Essayer la version web, sans installer" data-act="run" data-mode="web" data-repo="${repo}">${icon("globe")}</button>` : "");
  if (l.running) return `<button class="btn danger" data-act="stop" data-repo="${repo}">${icon("stop")}Arrêter</button>`;
  if (l.can_run) {
    const m = preferredMode(r.repo, l), many = modesOf(l).length > 1;
    const label = m === "web" ? "Version web" : l.built ? "Lancer" : "Compiler et lancer";
    return `<span class="split"><button class="btn green" data-act="run" data-mode="${m}" data-repo="${repo}" title="Mode : ${MODES[m].label}">${icon(MODES[m].icon)}${label}</button>` +
      (many ? `<button class="btn green caret" data-modes="${repo}" title="Choisir comment lancer">${icon("chevron")}</button>` : "") + `</span>`;
  }
  return `<button class="btn" data-act="update" data-repo="${repo}">${icon("refresh")}Mettre à jour</button>`;
}

function card(raw) {
  const r = norm(raw), c = cat(r.category), l = r.local;
  return `<div class="card" style="--cat:${c.color}" data-detail="${esc(r.repo)}">
    <div class="card-top">
      ${avatar(r.owner, 88)}
      <div class="titles"><div class="t">${esc(r.title)}</div><div class="r">${esc(r.repo)}</div></div>
      <span class="pill">${c.icon} ${esc(c.name)}</span>
    </div>
    ${r.buzz ? buzzStrip(r.buzz) : ""}
    <p class="desc">${esc(r.text)}</p>
    ${r.tagList.length ? `<div class="tags">${r.tagList.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    <div class="meta">
      <span title="Étoiles">${icon("star")}${k(r.stars)}</span>
      ${r.forks != null ? `<span title="Forks">${icon("fork")}${k(r.forks)}</span>` : ""}
      ${r.language ? `<span><i class="lang-dot" style="background:${LANG_COLORS[r.language] || "#8b949e"}"></i>${esc(r.language)}</span>` : ""}
      ${r.private ? `<span class="badge b-off">${icon("lock")}Privé</span>` : ""}
      ${r.fork ? `<span class="badge b-off">${icon("fork")}Fork</span>` : ""}
      ${r.new ? `<span class="badge b-run">${icon("sparkle")}Nouveau</span>` : ""}
      ${S.view === "following" && r.created_at ? `<span title="Date de création">${icon("plus")}créé ${ago(r.created_at)}</span>` : ""}
      ${r.gained ? `<span class="gain">+${k(r.gained)} ★${S.source === "weekly" ? "cette semaine" : S.source === "monthly" ? "ce mois" : "aujourd'hui"}</span>` : ""}
      ${r.pushed_at ? `<span title="Dernière activité">${icon("clock")}${ago(r.pushed_at)}</span>` : ""}
    </div>
    ${l.installed || l.platform ? `<div class="badges">${badges(l)}</div>` : ""}
    <div class="actions">
      ${primaryButton(r)}
      ${l.installed && l.behind > 0 && l.can_run && !busy(r.repo) ? `<button class="btn warn icon" title="Mettre à jour" data-act="update" data-repo="${esc(r.repo)}">${icon("refresh")}</button>` : ""}
      <span class="grow"></span>
      ${favButton(r.repo)}
      <a class="btn icon" title="Ouvrir sur GitHub" href="https://github.com/${esc(r.repo)}" target="_blank">${icon("github")}</a>
      <button class="btn icon" title="Plus d'actions" data-menu="${esc(r.repo)}">${icon("more")}</button>
    </div>
  </div>`;
}

const grid = (items, empty = "Rien à afficher ici.") => {
  const list = items.filter(matches);
  return list.length ? `<div class="grid">${list.map(card).join("")}</div>`
                     : `<div class="empty">${S.query ? "Aucun résultat ici pour « " + esc(S.query) + " »." +
                         `<br><br><button class="btn primary" data-gh-search="${esc(S.query)}">${icon("search")}Chercher « ${esc(S.query)} » sur tout GitHub</button>` : empty}</div>`;
};
const skeletons = n => `<div class="grid">${"<div class='skeleton'></div>".repeat(n)}</div>`;
const section = (title, n, body, more = "") =>
  `<div class="section"><div class="section-head"><h3>${title}${n != null ? ` <span class="n">${n}</span>` : ""}</h3>${more ? `<span class="more">${more}</span>` : ""}</div>${body}</div>`;
const sourceSwitch = () => `<div class="seg">${SOURCES.map(([v, l]) => `<button data-source="${v}" class="${S.source === v ? "on" : ""}">${l}</button>`).join("")}</div>`;
const trendToolbar = () => `<div class="toolbar">${sourceSwitch()}

function draw() {
  drawNav();
  const [view, arg] = S.view.split(":");
  const [title, sub] = view === "cat" ? [cat(arg).name, CAT_BLURB[arg] || ""] : TITLES[view];
  $("#pageTitle").textContent = title;
  $("#pageSub").textContent = sub;
  const content = $("#content"), top = content.scrollTop;
  // le contenu est reconstruit : on garde ce qui est en cours de saisie dans ses champs
  const typed = [...content.querySelectorAll("input")].map(i => [i.id, i.value]);
  const focused = document.activeElement?.closest?.("#content") && document.activeElement.id;
  const caret = focused && [document.activeElement.selectionStart, document.activeElement.selectionEnd];
  content.innerHTML = view === "cat" ? VIEWS.category(arg) : VIEWS[view]();
  content.scrollTop = top;
  typed.forEach(([id, v]) => { const i = id && document.getElementById(id); if (i) i.value = v; });
  if (focused) { const i = document.getElementById(focused); if (i) { i.focus(); i.setSelectionRange?.(...caret); } }
  const lang = $("#lang");
  if (lang) lang.onkeydown = e => { if (e.key === "Enter") { S.language = lang.value.trim(); S.trending = {}; loadTrending(); } };
  const followIn = $("#followIn");
  if (followIn) followIn.onkeydown = e => { if (e.key === "Enter") followAdd(followIn.value); };
  if (view === "following" && S.follows?.profiles && !S.followsSeenSent) {
    // le fil est affiché : à la prochaine visite, ces dépôts ne seront plus « nouveaux »
    S.followsSeenSent = true;
    api("/api/follows/seen", {});
  }
  const ghq = $("#ghq"), glang = $("#glang");
  if (ghq) ghq.onkeydown = e => { if (e.key === "Enter") runSearch(ghq.value); };
  if (glang) glang.onkeydown = e => { if (e.key === "Enter") runSearch(ghq.value); };
  if (S.detail) drawDetail();
  drawSide();
}

  const running = S.jobs.filter(j => j.state === "running").length;

  const r = norm(allKnown().get(repo)), l = r.local;
  let last = "";

  const dlg = document.createElement("div");

  dlg.innerHTML = `<div class="dialog" style="--cat:${cat(r.category).color}">
      <div class="dialog-head">${avatar(r.owner, 64)}<div><h3>Lancer ${esc(r.title)}</h3>

      ${l.args_hint ? `<div class="hint info" style="margin-top:10px">${icon("info")}<span>Exemple : <code>${esc(l.args_hint)}</code></span></div>` : ""}
      <div class="dialog-tools">
        <button class="btn small" data-pick="open">${icon("folder")}Insérer un fichier…</button>
        <button class="btn small" data-pick="save">${icon("download")}Choisir un fichier de sortie…</button>
      </div>
      <div class="dialog-foot">
        <button class="btn ghost" data-close>Annuler</button>
        <button class="btn green" data-go>${icon("play")}Lancer</button>
      </div>
    </div>`;
  document.body.appendChild(dlg);
  const args = dlg.querySelector("#hubArgs");
  args.focus();
  const close = () => dlg.remove();
  dlg.addEventListener("click", async e => {
    if (e.target === dlg) return close();  // clic à côté de la fenêtre
    const b = e.target.closest("button");
    if (!b) return;
    if ("close" in b.dataset) return close();
    if (b.dataset.pick) {
      // la fenêtre de choix de fichier de KDE s'ouvre côté système et renvoie un vrai chemin
      b.disabled = true;
      const res = await api("/api/pick", {save: b.dataset.pick === "save"});
      b.disabled = false;
      if (res.path) args.value = (args.value.trim() + " " + quoteArg(res.path)).trim();
      args.focus();
    } else if ("go" in b.dataset) {
      try { localStorage.setItem("hub.args." + repo, args.value); } catch (e) {}
      close();
      startRun(repo, "hub", args.value);
    }
  });
  dlg.addEventListener("keydown", e => {
    if (e.key === "Escape") close();
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) dlg.querySelector("[data-go]").click();
  });
}
const quoteArg = p => /^[\w@%+=:,./-]+$/.test(p) ? p : `'${p.replace(/'/g, `'\\''`)}'`;

async function startRun(repo, mode, args = "") {
  const res = await api("/api/run", {repo, mode, args});

  if (mode === "hub") { S.expanded.add(res.job); openActivity(); }

}

/* ================= actions & tâches ================= */
const ACTION_DONE = { install: "installé", update: "mis à jour", build: "recompilé", run: "lancé", remove: "supprimé" };
async function act(action, repo, mode, data = {}) {
  closeMenu();
  if (action === "open" || action === "terminal") {
    const res = await api("/api/" + action, {repo});
    return res.error && toast(res.error, "err");  // ex. aucun terminal installé
  }
  if (action === "copy-path") {
    const path = allKnown().get(repo)?.local?.path;
    return navigator.clipboard.writeText(path).then(() => toast("Chemin copié : " + path, "ok"));
  }
  if (action === "shortcut") {
    const on = data.on === "true", where = data.kind === "desktop" ? "le bureau" : "le menu et les favoris";
    const res = await api("/api/shortcut", {repo, kind: data.kind, on});
    if (res.error) return toast(res.error, "err");
    toast(on ? `Raccourci ajouté sur ${where} ✔` : `Raccourci retiré de ${where}`, "ok");
    return loadCatalog();
  }
  if (action === "clean") {
    const size = allKnown().get(repo)?.local?.size?.build;
    if (!confirm(`Effacer les fichiers de compilation de ${repo} (${bytes(size)}) ?\n\n` +
                 `Le code et tes réglages restent. Le projet sera recompilé tout seul au prochain lancement.`)) return;
  }
  if (action === "run" && mode) {
    try { localStorage.setItem("hub.mode." + repo, mode); } catch (e) {}
    const l = allKnown().get(repo).local;
    if (mode === "web") { window.open(l.web, "_blank"); return draw(); }
    if (mode === "hub") { draw(); return openHubDialog(repo); }
    draw();
    return startRun(repo, mode);
  }
  if (action === "stop") { await api("/api/stop", {repo}); toast(`${repo} arrêté.`, "ok"); return setTimeout(loadCatalog, 500); }
  const known = allKnown().get(repo);
  if (action === "install" && !known?.curated && !known?.mine && !confirm(
      `${repo} ne fait pas partie de ta sélection vérifiée.\n\n` +
      `Le hub va télécharger son code, le compiler et pouvoir le lancer sur ton PC. ` +
      `Les « cheats », « boosters FPS » ou « cracks » sont souvent des pièges à virus.\n\n` +
      `Continuer seulement si tu as confiance dans ce projet. Installer ?`)) return;
  if (action === "remove" && !confirm(`Supprimer ${repo} de ton PC` +
      (known?.local?.size ? ` (${bytes(known.local.size.total)})` : "") +
      ` ?\nLe dossier local et ses raccourcis seront effacés (tu pourras le réinstaller).`)) return;
  const res = await api("/api/" + action, {repo});
  if (res.error) return toast(res.error, "err");
  if (action !== "run") { S.expanded.add(res.job); openActivity(); }
  await pollJobs();
}

async function pollJobs() {
  const before = new Map(S.jobs.map(j => [j.id, j.state]));
  S.jobs = await api("/api/jobs");
  let finished = false;
  for (const j of S.jobs) {
    if (before.get(j.id) === "running" && j.state !== "running") {
      finished = true;
      if (j.state === "ok") toast(`${j.repo.split("/")[1]} ${ACTION_DONE[j.action] || "terminé"} ✔`, "ok");
      else { toast(`Échec : ${ACTION_LABEL[j.action] || j.action} de ${j.repo.split("/")[1]}`, "err"); S.expanded.add(j.id); openActivity(); }
    }
  }
  const running = S.jobs.some(j => j.state === "running");
  if (finished) loadCatalog(); else if (running && ![...before.values()].includes("running")) draw();
  drawActivity();
  drawSide();
  clearTimeout(pollTimer);
  if (running) pollTimer = setTimeout(pollJobs, 800);
}

/* ================= panneau Activité ================= */
const ACTION_LABEL = { install: "Installation", update: "Mise à jour", build: "Compilation", run: "Lancement", remove: "Suppression" };

/* Où en est une tâche, d'après les lignes de son journal. */
function jobProgress(j) {
  const log = j.log, last = [...log].reverse().find(l => l.trim()) || "";
  const compiling = log.some(l => l.startsWith("── Compilation"));
  const submodules = log.some(l => l.startsWith("── Sous-modules"));
  const crates = log.filter(l => /^\s*Compiling /.test(l)).length;
  const pct = !compiling && [...log].reverse().map(l => l.match(/(\d{1,3})\s?%/)).find(Boolean);
  let phase = ACTION_LABEL[j.action] || j.action;
  if (j.state === "ok") phase = { install: "Installé", update: "Mis à jour", build: "Compilé", run: "Lancé", remove: "Supprimé" }[j.action] || "Terminé";
  else if (j.state === "error") phase = "Échec";
  else if (compiling) phase = crates ? `Compilation · ${crates} modules` : "Compilation…";
  else if (submodules) phase = "Sous-modules…";
  else if (j.action === "install") phase = "Téléchargement…";
  return { phase, last, pct: pct ? Math.min(100, +pct[1]) : null };
}
function duration(j) {
  const s = Math.round(((j.ended || Date.now() / 1000) - j.started));
  return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")}`;
}

function drawActivity() {
  const jobs = S.jobs.filter(j => !S.hidden.has(j.id));
  const running = S.jobs.filter(j => j.state === "running").length;
  const btn = $("#activityBtn");
  btn.innerHTML = (running ? `<span class="spin" style="border-top-color:var(--accent)"></span>` : icon("activity")) + "Activité" +
                  (running ? `<span class="num">${running}</span>` : "");
  btn.classList.toggle("on", S.activityOpen);
  $("#actTitle").innerHTML = icon("activity") + "Activité";
  $("#actSub").textContent = running ? `${running} en cours · ${jobs.length - running} terminée(s)` : jobs.length ? `${jobs.length} tâche(s) récente(s)` : "Rien en cours";
  $("#clearDone").style.display = jobs.some(j => j.state !== "running") ? "" : "none";
  if (!S.activityOpen) return;
  const list = $("#actList");
  // on garde la position de lecture des journaux ouverts pendant le rafraîchissement
  const scroll = {};
  list.querySelectorAll(".job-log").forEach(p => scroll[p.dataset.id] = [p.scrollTop, p.scrollTop + p.clientHeight >= p.scrollHeight - 30]);
  if (!jobs.length) {
    list.innerHTML = `<div class="act-empty">${icon("activity")}<br>Aucune tâche pour l'instant.<br>Les installations, mises à jour et compilations s'afficheront ici.</div>`;
    return;
  }
  list.innerHTML = jobs.map(j => {
    const p = jobProgress(j), owner = j.repo.split("/")[0], open = S.expanded.has(j.id);
    const state = j.state === "running" ? `<span class="spin"></span>` : icon(j.state === "ok" ? "check" : "alert");
    return `<div class="job ${j.state}">
      <div class="job-top" data-job="${j.id}">
        ${avatar(owner, 64)}
        <div class="job-title"><b>${esc(j.repo.split("/")[1])}</b><span>${esc(p.phase)} · ${duration(j)}</span></div>
        <span class="job-state">${state}</span>
      </div>
      ${j.state === "running" ? `<div class="progress ${p.pct == null ? "indet" : ""}"><i style="${p.pct == null ? "" : `width:${p.pct}%`}"></i></div>` : ""}
      ${open ? `<pre class="job-log" data-id="${j.id}">${esc(j.log.join("\n") || "…")}</pre>
        <div class="job-tools">
          <button class="btn small" data-copy="${j.id}">${icon("copy")}Copier le journal</button>
          ${j.action !== "remove" ? `<button class="btn small" data-act="open" data-repo="${esc(j.repo)}">${icon("folder")}Dossier</button>` : ""}
          <span style="flex:1"></span>
          <button class="btn small ghost" data-job="${j.id}">Replier</button>
        </div>`
      : `<div class="job-last" data-job="${j.id}" title="Cliquer pour voir le journal complet">${esc(p.last || "…")}</div>`}
    </div>`;
  }).join("");
  list.querySelectorAll(".job-log").forEach(p => {
    const [top, atBottom] = scroll[p.dataset.id] || [0, true];
    p.scrollTop = atBottom ? p.scrollHeight : top;
  });
}

function openActivity(open = true) {
  S.activityOpen = open;
  document.querySelector(".app").classList.toggle("with-activity", open);
  try { localStorage.setItem("hub.activity", open ? "1" : "0"); } catch (e) {}
  drawActivity();
}

function toast(msg, kind = "ok") {
  const t = document.createElement("div");
  t.className = "toast " + kind;
  t.innerHTML = (kind === "ok" ? icon("check") : icon("alert")) + `<span>${esc(msg)}</span>`;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

/* ================= chargement ================= */
async function loadCatalog() {
  const d = await api("/api/catalog");
  S.catalog = d; S.categories = d.categories; S.favs = new Set(d.favorites || []);
  S.followSet = new Set(d.follows || []);
  if (S.detail) drawDetail();
  draw();
  // les poids se calculent en arrière-plan côté serveur : on repasse les chercher
  clearTimeout(S.sizeTimer);
  if (installed().some(r => !r.local.size)) S.sizeTimer = setTimeout(loadCatalog, 2500);
}
// tendances générales sous la clé « daily », celles d'une catégorie sous « jeux|daily »
const trendKey = (source, catId = "") => catId ? `${catId}|${source}` : source;
const viewCat = () => S.view.startsWith("cat:") ? S.view.slice(4) : "";
async function loadTrending(source = S.source, catId = viewCat()) {
  const key = trendKey(source, catId);
  if (key in S.trending) return;  // déjà chargé ou en cours
  S.trending[key] = null;
  draw();
  const q = `/api/trending?source=${source}&language=${encodeURIComponent(S.language)}` +
            (catId ? `&category=${catId}` : "");
  const d = await api(q).catch(e => ({error: String(e), retry: true}));
  S.trending[key] = d;
  if (d.error) setTimeout(() => {
    delete S.trending[key];  // l'erreur n'est pas gardée : on retente
    if (trendKey(S.source, viewCat()) === key || (key === S.source && S.view === "trending")) loadTrending(source, catId);
  }, d.retry ? 60000 : 15000);
  if (d.categories) S.categories = d.categories;
  draw();
}
function recentSearches() {
  try { return JSON.parse(localStorage.getItem("hub.recent") || "[]"); } catch (e) { return []; }
}
async function runSearch(q = S.search.q, append = false) {
  const s = S.search;
  q = (q || "").trim();
  if (!q) return $("#ghq")?.focus();
  s.language = ($("#glang")?.value ?? s.language).trim();
  s.q = q;
  if ($("#ghq")) $("#ghq").value = q;  // ex. clic sur une recherche récente
  if (append) s.page++; else Object.assign(s, {page: 1, items: [], total: 0, more: false});
  s.loading = true; s.error = null;
  if (S.view !== "search") { S.view = "search"; closeDetail(); $("#content").scrollTop = 0; }
  draw();
  try { localStorage.setItem("hub.recent", JSON.stringify([q, ...recentSearches().filter(x => x !== q)].slice(0, 8))); } catch (e) {}
  const url = `/api/search?q=${encodeURIComponent(q)}&sort=${s.sort}&language=${encodeURIComponent(s.language)}&page=${s.page}`;
  const d = await api(url).catch(e => ({error: String(e)}));
  if (s.q !== q) return;  // une autre recherche a été lancée entre-temps
  s.loading = false;
  if (d.error) { s.error = d.error; if (append) s.page--; }
  else {
    s.items = append ? s.items.concat(d.items) : d.items;
    s.total = d.total; s.more = d.more;
    if (d.categories) S.categories = d.categories;
  }
  draw();
}

async function loadMine(refresh = false) {
  if (S.mine === null || (S.mine && !refresh && !S.mine.error)) return;  // en cours, ou déjà là
  S.mine = null;
  draw();
  S.mine = await api("/api/mine" + (refresh ? "?refresh=1" : "")).catch(e => ({error: String(e)}));
  if (S.mine.categories) S.categories = S.mine.categories;
  draw();
}

async function loadBuzz() {
  if (S.buzz !== undefined) return;  // déjà chargé ou en cours
  S.buzz = null;
  draw();
  const d = await api("/api/buzz").catch(e => ({error: String(e), retry: true}));
  S.buzz = d;
  if (d.error) setTimeout(() => {
    S.buzz = undefined;
    if (S.view === "buzz" || S.view === "home") loadBuzz();
  }, d.retry ? 60000 : 15000);
  draw();
}
async function checkUpdates() {
  const b = $("#check");
  b.disabled = true; b.innerHTML = `<span class="spin"></span>`;
  try {
    const res = await api("/api/check", {});
    const n = Object.values(res).filter(s => s.behind > 0).length;
    S.checkInfo = Object.keys(res).length ? (n ? null : "Tout est à jour") : "Prêt";
    if (n) toast(`${n} mise(s) à jour disponible(s)`, "ok");
  } catch (e) {
    toast("La vérification des mises à jour a échoué.", "err");
  } finally {
    b.disabled = false; b.innerHTML = icon("refresh");  // jamais de bouton grisé pour de bon
  }
  loadCatalog();
}

/* ================= évènements ================= */
document.addEventListener("click", e => {
  const el = e.target.closest("button, a, .card");
  if (S.menu && !e.target.closest(".menu") && !e.target.closest("[data-menu], [data-modes]")) closeMenu();
  if (!el || el.tagName === "A") { if (el?.tagName === "A") closeMenu(); return; }
  const d = el.dataset;
  if (d.view) { S.view = d.view; closeDetail(); if (S.view === "trending" || viewCat()) loadTrending(); else if (S.view === "home") loadTrending("daily", "");
    if (S.view === "buzz" || S.view === "home") loadBuzz();
    if (S.view === "following") loadFollows();
    draw(); $("#content").scrollTop = 0; }
  else if (d.source) { S.source = d.source; loadTrending(); draw(); }
  else if ("gogh" in d) runSearch($("#ghq").value);
  else if (d.gsort) { S.search.sort = d.gsort; S.search.q ? runSearch($("#ghq").value || S.search.q) : draw(); }
  else if (d.qtip) {
    const box = $("#ghq");
    box.value = (box.value.trim() + " " + d.qtip).trim() + " ";
    box.focus();
  }
  else if (d.recent) runSearch(d.recent);
  else if (d.mineFilter) { S.mineFilter = d.mineFilter; draw(); }
  else if (d.instSort) { S.instSort = d.instSort; draw(); }
  else if ("followAdd" in d) followAdd($("#followIn").value);
  else if (d.followToggle) { e.stopPropagation(); closeMenu(); followSet(d.followToggle, d.on === "true"); }
  else if (d.followFilter) { S.followFilter = S.followFilter === d.followFilter ? "all" : d.followFilter; draw(); }
  else if ("mineRefresh" in d) loadMine(true);
  else if ("more" in d) runSearch(S.search.q, true);
  else if (d.ghSearch) { $("#search").value = ""; S.query = ""; runSearch(d.ghSearch); }
  else if (d.menu) { e.stopPropagation(); S.menu?.dataset.repo === d.menu ? closeMenu() : (openMenu(el, d.menu), S.menu.dataset.repo = d.menu); }
  else if (d.modes) { e.stopPropagation(); S.menu?.dataset.repo === "modes:" + d.modes ? closeMenu() : openModeMenu(el, d.modes); }
  else if (d.act) { e.stopPropagation(); act(d.act, d.repo, d.mode, d); }
  else if (d.detailOpen) { closeMenu(); openDetail(d.detailOpen); }
  else if (d.detail) openDetail(d.detail);
  else if (d.fav) { e.stopPropagation(); closeMenu(); toggleFav(d.fav); }
  else if (d.copy) {
    const j = S.jobs.find(x => x.id === d.copy);
    navigator.clipboard.writeText(j.log.join("\n")).then(() => toast("Journal copié.", "ok"));
  }
});
// clic sur l'en-tête ou la dernière ligne d'une tâche : déplier / replier son journal
$("#actList").addEventListener("click", e => {
  const el = e.target.closest("[data-job]");
  if (!el) return;
  const id = el.dataset.job;
  S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id);
  drawActivity();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); closeDetail(); } });
$("#overlay").onclick = closeDetail;
$("#content").addEventListener("scroll", closeMenu);
$("#activityBtn").onclick = () => openActivity(!S.activityOpen);
$("#closeActivity").onclick = () => openActivity(false);
$("#sideStatus").onclick = () => openActivity(true);
$("#clearDone").onclick = () => { S.jobs.filter(j => j.state !== "running").forEach(j => S.hidden.add(j.id)); drawActivity(); };
$("#check").onclick = checkUpdates;
$("#search").oninput = e => { S.query = e.target.value.trim(); draw(); };
// Entrée dans le filtre du haut : la même saisie part en recherche sur tout GitHub
$("#search").onkeydown = e => {
  if (e.key !== "Enter" || !e.target.value.trim()) return;
  const q = e.target.value.trim();
  e.target.value = ""; S.query = "";
  runSearch(q);
};
$("#updateAll").onclick = async () => {
  const res = await api("/api/update-all", {});
  if (!res.jobs.length) return toast("Rien à mettre à jour pour l'instant.", "ok");
  openActivity(); pollJobs();
};
// l'état « lancé / arrêté » des programmes change hors du hub : on le relit
setInterval(() => { if (!document.hidden && !S.menu && !S.jobs.some(j => j.state === "running")) loadCatalog(); }, 20000);

$("#searchIcon").innerHTML = icon("search");
$("#check").innerHTML = icon("refresh");
$("#updateAll").innerHTML = icon("download") + "Tout mettre à jour";
$("#closeActivity").innerHTML = icon("x");
let wasOpen = false;
try { wasOpen = localStorage.getItem("hub.activity") === "1"; } catch (e) {}
openActivity(wasOpen);
draw();
loadCatalog().then(checkUpdates);
loadTrending("daily");
loadBuzz();
loadMine();
loadFollows();
pollJobs();
</script>
</body>
</html>
